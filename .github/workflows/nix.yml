name: Nix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - hashview-web
          - hashview-agent
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build ${{ matrix.package }}
        run: nix build -L --print-out-paths ".#${{ matrix.package }}"

  checks:
    name: Flake checks (unit + VM tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for the NixOS VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run flake checks
        run: nix flake check -L
